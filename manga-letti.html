<script>


/* NORMALIZZA */

function normalizza(titolo){

  return String(titolo || "")
    .toLowerCase()
    .trim()
    .replace(/\s*[—–-]\s*/g," ")
    .replace(/\s+/g," ");

}


/* COPERTINA LOCALE DI RISERVA */

function chiaveCopertina(titolo){

  return "cover_" +
    normalizza(titolo);

}


function trovaCopertinaLocale(titolo){

  return localStorage.getItem(
    chiaveCopertina(titolo)
  ) || "";

}


/* =========================
   74 MANGA BASE
========================= */

const libriBase=[];


function aggiungiSerie(
  nome,
  volumi
){

  for(
    let i=1;
    i<=volumi;
    i++
  ){

    libriBase.push(
      nome +
      " — Vol. " +
      i
    );

  }

}


aggiungiSerie(
  "My Dress-Up Darling",
  15
);


aggiungiSerie(
  "The Fragrant Flower Blooms with Dignity",
  5
);


aggiungiSerie(
  "Inazuma & Romance",
  6
);


aggiungiSerie(
  "Lei e il suo cane da guardia",
  6
);


aggiungiSerie(
  "Ice Guy & Cool Girl",
  11
);


aggiungiSerie(
  "I diari della speziale",
  15
);


aggiungiSerie(
  "A Sign of Affection",
  12
);


libriBase.push(
  "Le 100 ragazze che ti amano tanto tanto tanto tanto tanto — Vol. 1"
);


libriBase.push(
  "First Kiss"
);


libriBase.push(
  "Gli agenti delle quattro stagioni — Vol. 1"
);


libriBase.push(
  "Gli agenti delle quattro stagioni — Vol. 2"
);


/* =========================
   CREA CARD
========================= */

function creaScheda(libro){

  const titolo=
    libro.titolo;


  /*
    Prima usa la copertina
    sincronizzata nel CLOUD.

    Se non c'è, prova quella
    locale del dispositivo.
  */

  const copertina=
    libro.copertina
    ||
    trovaCopertinaLocale(
      titolo
    )
    ||
    "";


  const scheda=
    document.createElement(
      "div"
    );


  scheda.className=
    "book-card";


  scheda.dataset.titolo=
    normalizza(
      titolo
    );


  const cover=
    document.createElement(
      "div"
    );


  cover.className=
    "book-cover";


  if(copertina){

    const img=
      document.createElement(
        "img"
      );


    img.src=
      copertina;


    img.alt=
      titolo;


    img.loading=
      "lazy";


    img.addEventListener(
      "error",
      function(){

        cover.innerHTML=
          "🌸";

      }
    );


    cover.appendChild(
      img
    );

  }

  else{

    cover.textContent=
      "🌸";

  }


  const info=
    document.createElement(
      "div"
    );


  info.className=
    "book-info";


  const nome=
    document.createElement(
      "div"
    );


  nome.className=
    "book-title";


  nome.textContent=
    titolo;


  const stato=
    document.createElement(
      "div"
    );


  stato.className=
    "book-status";


  stato.textContent=
    "✓ Letto";


  info.appendChild(
    nome
  );


  info.appendChild(
    stato
  );


  scheda.appendChild(
    cover
  );


  scheda.appendChild(
    info
  );


  return scheda;

}


/* =========================
   UNISCE BASE + CLOUD
========================= */

function creaListaFinale(libriCloud){

  const mappaCloud=
    new Map();


  libriCloud.forEach(
    function(libro){

      if(
        !libro
        ||
        !libro.titolo
      ){

        return;

      }


      mappaCloud.set(
        normalizza(
          libro.titolo
        ),
        libro
      );

    }
  );


  const risultato=[];

  const titoliUsati=
    new Set();


  /*
    MANGA BASE

    Se lo stesso titolo esiste
    nel cloud, è la versione
    cloud a decidere categoria,
    stato e copertina.

    Quindi se un manga viene
    spostato in "Da leggere"
    non rimane duplicato qui.
  */

  libriBase.forEach(
    function(titoloBase){

      const chiave=
        normalizza(
          titoloBase
        );


      const versioneCloud=
        mappaCloud.get(
          chiave
        );


      if(versioneCloud){

        if(
          versioneCloud.categoria
            === "Manga"
          &&
          versioneCloud.stato
            === "Letto"
        ){

          risultato.push({

            ...versioneCloud,

            titolo:
              versioneCloud.titolo
              ||
              titoloBase

          });


          titoliUsati.add(
            chiave
          );

        }


        return;

      }


      risultato.push({

        id:null,

        titolo:
          titoloBase,

        categoria:
          "Manga",

        stato:
          "Letto",

        copertina:
          "",

        lettura_attuale:
          false

      });


      titoliUsati.add(
        chiave
      );

    }
  );


  /*
    NUOVI MANGA LETTI
    PRESENTI SOLO NEL CLOUD
  */

  libriCloud.forEach(
    function(libro){

      if(
        !libro
        ||
        !libro.titolo
        ||
        libro.categoria
          !== "Manga"
        ||
        libro.stato
          !== "Letto"
      ){

        return;

      }


      const chiave=
        normalizza(
          libro.titolo
        );


      if(
        titoliUsati.has(
          chiave
        )
      ){

        return;

      }


      risultato.push(
        libro
      );


      titoliUsati.add(
        chiave
      );

    }
  );


  return risultato;

}


/* =========================
   MOSTRA LIBRI
========================= */

function mostraLibri(libri){

  const lista=
    document.getElementById(
      "listaLibri"
    );


  lista.innerHTML=
    "";


  libri.forEach(
    function(libro){

      lista.appendChild(
        creaScheda(
          libro
        )
      );

    }
  );


  const totale=
    libri.length;


  document.getElementById(
    "numeroManga"
  ).textContent=
    totale;


  if(totale===0){

    const vuoto=
      document.createElement(
        "div"
      );


    vuoto.className=
      "empty";


    vuoto.textContent=
      "🌸 Nessun manga letto.";


    lista.appendChild(
      vuoto
    );

  }

}


/* =========================
   CARICA DAL CLOUD
========================= */

async function caricaLibri(){

  try{

    const risposta=
      await fetch(
        "https://martina-virtual-library.onrender.com/api/libri",
        {
          cache:"no-store"
        }
      );


    if(
      !risposta.ok
    ){

      throw new Error(
        "Errore nel caricamento dei manga."
      );

    }


    const dati=
      await risposta.json();


    const libriCloud=
      Array.isArray(dati.libri)
      ?
      dati.libri
      :
      [];


    const listaFinale=
      creaListaFinale(
        libriCloud
      );


    mostraLibri(
      listaFinale
    );

  }

  catch(errore){

    console.error(
      "Cloud non disponibile:",
      errore
    );


    /*
      Se il cloud non risponde,
      mostra comunque i
      74 manga base.
    */

    const libriEmergenza=
      libriBase.map(
        function(titolo){

          return {

            id:null,

            titolo:
              titolo,

            categoria:
              "Manga",

            stato:
              "Letto",

            copertina:
              "",

            lettura_attuale:
              false

          };

        }
      );


    mostraLibri(
      libriEmergenza
    );

  }

}
